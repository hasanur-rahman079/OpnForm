---
# Dokploy-compatible Docker Compose file for OpnForm
#
# Usage with Dokploy:
#   1. Run: bash scripts/generate-dokploy-secrets.sh
#   2. Copy the output into Dokploy's Environment tab
#   3. Also set APP_URL and DB_PASSWORD in the Environment tab
#   4. Deploy
#
# No .env files, no YAML anchors, no bind-mount configs.
# Everything goes through Dokploy's environment variable tab.

services:
  db:
    image: postgres:16
    container_name: opnform-db
    environment:
      POSTGRES_DB: ${DB_DATABASE:-forge}
      POSTGRES_USER: ${DB_USERNAME:-forge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-forge}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-forge}"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: opnform-redis
    command: >
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a ${REDIS_PASSWORD}} ping | grep PONG"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped

  # -------------------------------------------------------------------
  # API (Laravel PHP-FPM)
  # -------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    # To use a pre-built image instead, comment the `build:` lines above
    # and uncomment the `image:` line below:
    # image: jhumanj/opnform-api:latest
    container_name: opnform-api
    volumes:
      - opnform_storage:/usr/share/nginx/html/storage:rw
    environment:
      # ---- Secrets (set in Dokploy env tab) ----
      APP_KEY: ${APP_KEY}
      JWT_SECRET: ${JWT_SECRET}
      FRONT_API_SECRET: ${FRONT_API_SECRET}
      # ---- Core ----
      APP_NAME: ${APP_NAME:-OpnForm}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      FRONT_URL: ${FRONT_URL:-http://localhost}
      LOG_CHANNEL: ${LOG_CHANNEL:-errorlog}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      # ---- Database ----
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-forge}
      DB_USERNAME: ${DB_USERNAME:-forge}
      DB_PASSWORD: ${DB_PASSWORD:-forge}
      # ---- Redis ----
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CACHE_DRIVER: ${CACHE_DRIVER:-redis}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      # ---- Storage ----
      FILESYSTEM_DRIVER: ${FILESYSTEM_DRIVER:-local}
      LOCAL_FILESYSTEM_VISIBILITY: ${LOCAL_FILESYSTEM_VISIBILITY:-public}
      # ---- JWT ----
      JWT_TTL: ${JWT_TTL:-1440}
      JWT_SKIP_IP_UA_VALIDATION: ${JWT_SKIP_IP_UA_VALIDATION:-true}
      PUBLIC_UPLOADS_RATE_LIMIT_PER_MINUTE: ${PUBLIC_UPLOADS_RATE_LIMIT_PER_MINUTE:-30}
      PUBLIC_UPLOADS_RATE_LIMIT_PER_HOUR: ${PUBLIC_UPLOADS_RATE_LIMIT_PER_HOUR:-300}
      # ---- Mail ----
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-OpnForm}
      # ---- PHP Tuning ----
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-1G}
      PHP_MAX_EXECUTION_TIME: ${PHP_MAX_EXECUTION_TIME:-600}
      PHP_UPLOAD_MAX_FILESIZE: ${PHP_UPLOAD_MAX_FILESIZE:-64M}
      PHP_POST_MAX_SIZE: ${PHP_POST_MAX_SIZE:-64M}
      # ---- Optional integrations ----
      OPEN_AI_API_KEY: ${OPEN_AI_API_KEY:-}
      H_CAPTCHA_SITE_KEY: ${H_CAPTCHA_SITE_KEY:-}
      H_CAPTCHA_SECRET_KEY: ${H_CAPTCHA_SECRET_KEY:-}
      RE_CAPTCHA_SITE_KEY: ${RE_CAPTCHA_SITE_KEY:-}
      RE_CAPTCHA_SECRET_KEY: ${RE_CAPTCHA_SECRET_KEY:-}
      TELEGRAM_BOT_ID: ${TELEGRAM_BOT_ID:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_FONTS_API_KEY: ${GOOGLE_FONTS_API_KEY:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_BUCKET: ${AWS_BUCKET:-}
      STRIPE_KEY: ${STRIPE_KEY:-}
      STRIPE_SECRET: ${STRIPE_SECRET:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SHOW_OFFICIAL_TEMPLATES: ${SHOW_OFFICIAL_TEMPLATES:-true}
      OPNFORM_ANONYMOUS_TELEMETRY_DISABLED: ${OPNFORM_ANONYMOUS_TELEMETRY_DISABLED:-false}
      ZAPIER_ENABLED: ${ZAPIER_ENABLED:-false}
      SENTRY_LARAVEL_DSN: ${SENTRY_LARAVEL_DSN:-}
      IPINFO_TOKEN: ${IPINFO_TOKEN:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      # ---- Self-hosted/cloud license ----
      LICENSE_API_ENDPOINT: ${LICENSE_API_ENDPOINT:-https://api.opnform.com}
      LICENSE_CHECKOUT_SUCCESS_URL: ${LICENSE_CHECKOUT_SUCCESS_URL:-https://opnform.com/self-hosted/checkout/success}
      LICENSE_CHECKOUT_CANCEL_URL: ${LICENSE_CHECKOUT_CANCEL_URL:-https://opnform.com/self-hosted/checkout/canceled}
      LICENSE_PORTAL_RETURN_URL: ${LICENSE_PORTAL_RETURN_URL:-https://opnform.com/self-hosted/checkout/success}
      # ---- Caddy custom domains ----
      CADDY_SECRET: ${CADDY_SECRET:-}
      CADDY_AUTHORIZED_IPS: ${CADDY_AUTHORIZED_IPS:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php /usr/share/nginx/html/artisan about || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # -------------------------------------------------------------------
  # Queue Worker (same image as api, different command)
  # -------------------------------------------------------------------
  api-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    # image: jhumanj/opnform-api:latest
    container_name: opnform-api-worker
    command: ["php", "artisan", "queue:work"]
    volumes:
      - opnform_storage:/usr/share/nginx/html/storage:rw
    environment:
      # ---- Secrets ----
      APP_KEY: ${APP_KEY}
      JWT_SECRET: ${JWT_SECRET}
      FRONT_API_SECRET: ${FRONT_API_SECRET}
      # ---- Core ----
      APP_NAME: ${APP_NAME:-OpnForm}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      FRONT_URL: ${FRONT_URL:-http://localhost}
      LOG_CHANNEL: ${LOG_CHANNEL:-errorlog}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      # ---- Database ----
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-forge}
      DB_USERNAME: ${DB_USERNAME:-forge}
      DB_PASSWORD: ${DB_PASSWORD:-forge}
      # ---- Redis ----
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CACHE_DRIVER: ${CACHE_DRIVER:-redis}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      # ---- Storage ----
      FILESYSTEM_DRIVER: ${FILESYSTEM_DRIVER:-local}
      LOCAL_FILESYSTEM_VISIBILITY: ${LOCAL_FILESYSTEM_VISIBILITY:-public}
      # ---- JWT ----
      JWT_TTL: ${JWT_TTL:-1440}
      JWT_SKIP_IP_UA_VALIDATION: ${JWT_SKIP_IP_UA_VALIDATION:-true}
      PUBLIC_UPLOADS_RATE_LIMIT_PER_MINUTE: ${PUBLIC_UPLOADS_RATE_LIMIT_PER_MINUTE:-30}
      PUBLIC_UPLOADS_RATE_LIMIT_PER_HOUR: ${PUBLIC_UPLOADS_RATE_LIMIT_PER_HOUR:-300}
      # ---- Mail ----
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-OpnForm}
      # ---- PHP Tuning ----
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-1G}
      PHP_MAX_EXECUTION_TIME: ${PHP_MAX_EXECUTION_TIME:-600}
      PHP_UPLOAD_MAX_FILESIZE: ${PHP_UPLOAD_MAX_FILESIZE:-64M}
      PHP_POST_MAX_SIZE: ${PHP_POST_MAX_SIZE:-64M}
      # ---- Optional integrations ----
      OPEN_AI_API_KEY: ${OPEN_AI_API_KEY:-}
      H_CAPTCHA_SITE_KEY: ${H_CAPTCHA_SITE_KEY:-}
      H_CAPTCHA_SECRET_KEY: ${H_CAPTCHA_SECRET_KEY:-}
      RE_CAPTCHA_SITE_KEY: ${RE_CAPTCHA_SITE_KEY:-}
      RE_CAPTCHA_SECRET_KEY: ${RE_CAPTCHA_SECRET_KEY:-}
      TELEGRAM_BOT_ID: ${TELEGRAM_BOT_ID:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_FONTS_API_KEY: ${GOOGLE_FONTS_API_KEY:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_BUCKET: ${AWS_BUCKET:-}
      STRIPE_KEY: ${STRIPE_KEY:-}
      STRIPE_SECRET: ${STRIPE_SECRET:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SHOW_OFFICIAL_TEMPLATES: ${SHOW_OFFICIAL_TEMPLATES:-true}
      OPNFORM_ANONYMOUS_TELEMETRY_DISABLED: ${OPNFORM_ANONYMOUS_TELEMETRY_DISABLED:-false}
      ZAPIER_ENABLED: ${ZAPIER_ENABLED:-false}
      SENTRY_LARAVEL_DSN: ${SENTRY_LARAVEL_DSN:-}
      IPINFO_TOKEN: ${IPINFO_TOKEN:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      LICENSE_API_ENDPOINT: ${LICENSE_API_ENDPOINT:-https://api.opnform.com}
      LICENSE_CHECKOUT_SUCCESS_URL: ${LICENSE_CHECKOUT_SUCCESS_URL:-https://opnform.com/self-hosted/checkout/success}
      LICENSE_CHECKOUT_CANCEL_URL: ${LICENSE_CHECKOUT_CANCEL_URL:-https://opnform.com/self-hosted/checkout/canceled}
      LICENSE_PORTAL_RETURN_URL: ${LICENSE_PORTAL_RETURN_URL:-https://opnform.com/self-hosted/checkout/success}
      CADDY_SECRET: ${CADDY_SECRET:-}
      CADDY_AUTHORIZED_IPS: ${CADDY_AUTHORIZED_IPS:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "pgrep -f 'php artisan queue:work' > /dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # -------------------------------------------------------------------
  # Scheduler (same image as api, different command)
  # -------------------------------------------------------------------
  api-scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    # image: jhumanj/opnform-api:latest
    container_name: opnform-api-scheduler
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - opnform_storage:/usr/share/nginx/html/storage:rw
    environment:
      # ---- Secrets ----
      APP_KEY: ${APP_KEY}
      JWT_SECRET: ${JWT_SECRET}
      FRONT_API_SECRET: ${FRONT_API_SECRET}
      # ---- Core ----
      APP_NAME: ${APP_NAME:-OpnForm}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      FRONT_URL: ${FRONT_URL:-http://localhost}
      LOG_CHANNEL: ${LOG_CHANNEL:-errorlog}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      # ---- Database ----
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-forge}
      DB_USERNAME: ${DB_USERNAME:-forge}
      DB_PASSWORD: ${DB_PASSWORD:-forge}
      # ---- Redis ----
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CACHE_DRIVER: ${CACHE_DRIVER:-redis}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      # ---- Storage ----
      FILESYSTEM_DRIVER: ${FILESYSTEM_DRIVER:-local}
      LOCAL_FILESYSTEM_VISIBILITY: ${LOCAL_FILESYSTEM_VISIBILITY:-public}
      # ---- JWT ----
      JWT_TTL: ${JWT_TTL:-1440}
      JWT_SKIP_IP_UA_VALIDATION: ${JWT_SKIP_IP_UA_VALIDATION:-true}
      PUBLIC_UPLOADS_RATE_LIMIT_PER_MINUTE: ${PUBLIC_UPLOADS_RATE_LIMIT_PER_MINUTE:-30}
      PUBLIC_UPLOADS_RATE_LIMIT_PER_HOUR: ${PUBLIC_UPLOADS_RATE_LIMIT_PER_HOUR:-300}
      # ---- Mail ----
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-OpnForm}
      # ---- PHP Tuning ----
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-1G}
      PHP_MAX_EXECUTION_TIME: ${PHP_MAX_EXECUTION_TIME:-600}
      PHP_UPLOAD_MAX_FILESIZE: ${PHP_UPLOAD_MAX_FILESIZE:-64M}
      PHP_POST_MAX_SIZE: ${PHP_POST_MAX_SIZE:-64M}
      # ---- Optional integrations ----
      OPEN_AI_API_KEY: ${OPEN_AI_API_KEY:-}
      H_CAPTCHA_SITE_KEY: ${H_CAPTCHA_SITE_KEY:-}
      H_CAPTCHA_SECRET_KEY: ${H_CAPTCHA_SECRET_KEY:-}
      RE_CAPTCHA_SITE_KEY: ${RE_CAPTCHA_SITE_KEY:-}
      RE_CAPTCHA_SECRET_KEY: ${RE_CAPTCHA_SECRET_KEY:-}
      TELEGRAM_BOT_ID: ${TELEGRAM_BOT_ID:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_FONTS_API_KEY: ${GOOGLE_FONTS_API_KEY:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_BUCKET: ${AWS_BUCKET:-}
      STRIPE_KEY: ${STRIPE_KEY:-}
      STRIPE_SECRET: ${STRIPE_SECRET:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SHOW_OFFICIAL_TEMPLATES: ${SHOW_OFFICIAL_TEMPLATES:-true}
      OPNFORM_ANONYMOUS_TELEMETRY_DISABLED: ${OPNFORM_ANONYMOUS_TELEMETRY_DISABLED:-false}
      ZAPIER_ENABLED: ${ZAPIER_ENABLED:-false}
      SENTRY_LARAVEL_DSN: ${SENTRY_LARAVEL_DSN:-}
      IPINFO_TOKEN: ${IPINFO_TOKEN:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      LICENSE_API_ENDPOINT: ${LICENSE_API_ENDPOINT:-https://api.opnform.com}
      LICENSE_CHECKOUT_SUCCESS_URL: ${LICENSE_CHECKOUT_SUCCESS_URL:-https://opnform.com/self-hosted/checkout/success}
      LICENSE_CHECKOUT_CANCEL_URL: ${LICENSE_CHECKOUT_CANCEL_URL:-https://opnform.com/self-hosted/checkout/canceled}
      LICENSE_PORTAL_RETURN_URL: ${LICENSE_PORTAL_RETURN_URL:-https://opnform.com/self-hosted/checkout/success}
      CADDY_SECRET: ${CADDY_SECRET:-}
      CADDY_AUTHORIZED_IPS: ${CADDY_AUTHORIZED_IPS:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "php /usr/share/nginx/html/artisan app:scheduler-status --mode=check --max-minutes=3 || exit 1",
        ]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 70s
    restart: unless-stopped

  # -------------------------------------------------------------------
  # UI (Nuxt 3 SSR Frontend)
  # -------------------------------------------------------------------
  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.client
      args:
        NODE_MEMORY: ${NODE_MEMORY:-4096}
    # To use a pre-built image instead:
    # image: jhumanj/opnform-client:latest
    container_name: opnform-client
    environment:
      NUXT_PUBLIC_APP_URL: ${NUXT_PUBLIC_APP_URL:-/}
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-/api}
      NUXT_PRIVATE_API_BASE: ${NUXT_PRIVATE_API_BASE:-http://ingress/api}
      NUXT_PUBLIC_ENV: ${NUXT_PUBLIC_ENV:-production}
      NUXT_API_SECRET: ${NUXT_API_SECRET}
      NUXT_PUBLIC_H_CAPTCHA_SITE_KEY: ${NUXT_PUBLIC_H_CAPTCHA_SITE_KEY:-}
      NUXT_PUBLIC_RE_CAPTCHA_SITE_KEY: ${NUXT_PUBLIC_RE_CAPTCHA_SITE_KEY:-}
      NUXT_PUBLIC_ROOT_REDIRECT_URL: ${NUXT_PUBLIC_ROOT_REDIRECT_URL:-}
      NUXT_PUBLIC_AMPLITUDE_CODE: ${NUXT_PUBLIC_AMPLITUDE_CODE:-}
      NUXT_PUBLIC_CRISP_WEBSITE_ID: ${NUXT_PUBLIC_CRISP_WEBSITE_ID:-}
      NUXT_PUBLIC_GTM_CODE: ${NUXT_PUBLIC_GTM_CODE:-}
      NUXT_PUBLIC_CLARITY_PROJECT_ID: ${NUXT_PUBLIC_CLARITY_PROJECT_ID:-}
      NUXT_PUBLIC_LICENSE_API_ENDPOINT: ${NUXT_PUBLIC_LICENSE_API_ENDPOINT:-https://api.opnform.com}
      SENTRY_DSN_PUBLIC: ${SENTRY_DSN_PUBLIC:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      SENTRY_REPLAY_SAMPLE_RATE: ${SENTRY_REPLAY_SAMPLE_RATE:-0}
      SENTRY_ERROR_REPLAY_SAMPLE_RATE: ${SENTRY_ERROR_REPLAY_SAMPLE_RATE:-0}
      NUXT_ALLOWED_EMBED_DOMAINS: ${NUXT_ALLOWED_EMBED_DOMAINS:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget --spider -q http://localhost:3000/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    restart: unless-stopped

  # -------------------------------------------------------------------
  # Ingress (NGINX reverse proxy)
  # -------------------------------------------------------------------
  ingress:
    build:
      context: .
      dockerfile: docker/Dockerfile.nginx
    # To use the standard nginx image with a bind-mount instead:
    # image: nginx:1
    container_name: opnform-ingress
    ports:
      - ${APP_PORT:-80}:80
    environment:
      NGINX_MAX_BODY_SIZE: ${NGINX_MAX_BODY_SIZE:-64m}
    depends_on:
      api:
        condition: service_started
      ui:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
  opnform_storage:
  redis-data:
